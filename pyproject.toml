[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instance-annotator"
version = "0.1.0"
description = "Web UI for TLS / MLS tree instance annotation, linked to an Ecomodel checkout for segmenters."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "laspy",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
instance-annotator = "instance_annotator.server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instance_annotator*"]

[tool.setuptools.package-data]
instance_annotator = [
  "web/*",
  "web/js/*",
  "web/vendor/*",
  "wood_leaf_defaults.json",
]
